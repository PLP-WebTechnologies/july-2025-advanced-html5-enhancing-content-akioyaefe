<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week 2 Assignment - HTML5 Multimedia and Forms</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f9f6;
      color: #333;
    }
    header, footer {
      background: #005f3c;
      color: white;
      text-align: center;
      padding: 1rem 0;
    }
    section {
      padding: 20px;
      margin: 20px auto;
      max-width: 800px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1, h2 {
      color: #005f3c;
    }
    form label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    form input, form select, form textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #005f3c;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      margin-top: 10px;
      cursor: pointer;
    }
    button:hover {
      background-color: #007d52;
    }
    video, audio {
      display: block;
      margin: 15px auto;
    }
  </style>
</head>
<body>
  <header>
    <h1>Week 2 Frontend Project</h1>
    <p>Created by Mrs. Efemena Preye Akioya 🌿</p>
  </header>

  <!-- 🎥 Multimedia Section -->
  <section>
    <h2>Multimedia Section</h2>
    <p>Below is a short video and an audio sample for testing HTML5 multimedia features.</p>

    <video width="320" height="240" controls>
      <source src="sample-video.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <audio controls>
      <source src="sample-audio.mp3" type="audio/mp3">
      Your browser does not support the audio element.
    </audio>
  </section>

  <!-- 📝 Form Section -->
  <section>
    <h2>Contact Form</h2>
    <form>
      <label for="name">Full Name:</label>
      <input type="text" id="name" name="name" required placeholder="Enter your full name">

      <label for="email">Email Address:</label>
      <input type="email" id="email" name="email" required placeholder="Enter your email">

      <label for="gender">Gender:</label>
      <select id="gender" name="gender" required>
        <option value="">--Select--</option>
        <option value="female">Female</option>
        <option value="male">Male</option>
        <option value="other">Other</option>
      </select>

      <label for="message">Your Message:</label>
      <textarea id="message" name="message" rows="4" placeholder="Write your message here..."></textarea>

      <button type="submit">Submit</button>
    </form>
  </section>

  <footer>
    <p>© 2025 Mrs. Efemena Preye Akioya | Power Learn Project</p>
  </footer>
</body>
</html>
